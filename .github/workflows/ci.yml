name: CI (deps-debug)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app -d app"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show repo root & requirements file
        run: |
          pwd
          ls -la
          echo "===== requirements.txt ====="
          nl -ba requirements.txt || true

      - name: Install dependencies (no cache) + force pins
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir "SQLAlchemy==2.0.36" "sqlmodel==0.0.22"

      - name: Assert critical imports
        run: |
          python - << 'PY'
import importlib, sys
for m in ("sqlmodel","sqlalchemy"):
    try:
        mod = importlib.import_module(m)
        print(f"OK import {m} ->", getattr(mod, "__version__", "n/a"))
    except Exception as e:
        print("IMPORT FAIL:", m, e)
        sys.exit(1)
PY

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
        run: |
          pytest -q
